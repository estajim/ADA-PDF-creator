name: Build Desktop App

on:
  push:
    tags: ["v*"]          # trigger on version tags like v1.0.0
  workflow_dispatch:      # allow manual trigger from GitHub UI

permissions:
  contents: write         # needed to upload release assets

jobs:
  # ── Mac build ──────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-14     # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Generate app icon
        run: |
          mkdir -p build
          python - << 'PYEOF'
from PIL import Image, ImageDraw
from pathlib import Path
import subprocess, sys

sizes = [16,32,64,128,256,512,1024]
iset  = Path("build/ADA_PDF_Converter.iconset")
iset.mkdir(parents=True, exist_ok=True)

for sz in sizes:
    img  = Image.new("RGBA",(sz,sz),(0,0,0,0))
    draw = ImageDraw.Draw(img)
    pad  = sz//10
    draw.ellipse([pad,pad,sz-pad,sz-pad], fill=(91,79,232,255))
    pw,ph = int(sz*.38),int(sz*.46)
    px,py = (sz-pw)//2, (sz-ph)//2-int(sz*.04)
    c = max(1,sz//20)
    draw.rounded_rectangle([px,py,px+pw,py+ph],radius=c,fill=(255,255,255,240))
    dog=int(pw*.28)
    draw.polygon([px+pw-dog,py,px+pw,py+dog,px+pw-dog,py+dog],fill=(200,195,245,255))
    bh,bw=max(1,sz//28),int(pw*.55)
    bx,sp=px+int(pw*.14),max(2,sz//18)
    for i in range(3):
        by2=py+ph//3+i*sp
        draw.rectangle([bx,by2,bx+bw,by2+bh],fill=(91,79,232,200))
    img.save(iset/f"icon_{sz}x{sz}.png")
    if sz<=512:
        img.resize((sz*2,sz*2),Image.LANCZOS).save(iset/f"icon_{sz}x{sz}@2x.png")

subprocess.run(["iconutil","-c","icns",str(iset),"-o","build/ada_pdf_icon.icns"],check=True)
print("Icon generated")
PYEOF

      - name: Build macOS app
        run: pyinstaller ada_pdf.spec --noconfirm

      - name: Zip artifact
        run: |
          cd dist
          zip -r ADA_PDF_Converter_macOS.zip ADA_PDF_Converter/

      - uses: actions/upload-artifact@v4
        with:
          name: ADA_PDF_Converter_macOS
          path: dist/ADA_PDF_Converter_macOS.zip
          retention-days: 30

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ADA_PDF_Converter_macOS.zip

  # ── Windows build ───────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt `
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller ada_pdf.spec --noconfirm

      - name: Zip artifact
        run: |
          Compress-Archive -Path dist\ADA_PDF_Converter `
            -DestinationPath dist\ADA_PDF_Converter_Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ADA_PDF_Converter_Windows
          path: dist\ADA_PDF_Converter_Windows.zip
          retention-days: 30

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\ADA_PDF_Converter_Windows.zip
