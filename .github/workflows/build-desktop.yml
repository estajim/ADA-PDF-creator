name: Build Desktop App

on:
  push:
    tags: ["v*"]          # trigger on version tags like v1.0.0
  workflow_dispatch:      # allow manual trigger from GitHub UI

permissions:
  contents: write         # needed to upload release assets

jobs:
  # ── Mac build ──────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-14     # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Generate app icon
        run: python scripts/generate_icon.py

      - name: Build macOS app
        run: pyinstaller ada_pdf.spec --noconfirm

      - name: Zip artifact
        run: |
          cd dist
          zip -r ADA_PDF_Converter_macOS.zip ADA_PDF_Converter/

      - uses: actions/upload-artifact@v4
        with:
          name: ADA_PDF_Converter_macOS
          path: dist/ADA_PDF_Converter_macOS.zip
          retention-days: 30

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ADA_PDF_Converter_macOS.zip

  # ── Windows build ───────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt `
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller ada_pdf.spec --noconfirm

      - name: Zip artifact
        run: |
          Compress-Archive -Path dist\ADA_PDF_Converter `
            -DestinationPath dist\ADA_PDF_Converter_Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ADA_PDF_Converter_Windows
          path: dist\ADA_PDF_Converter_Windows.zip
          retention-days: 30

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\ADA_PDF_Converter_Windows.zip
